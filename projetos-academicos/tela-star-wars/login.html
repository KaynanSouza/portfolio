<!doctype html>
<html lang="pt-br">

<head>
  <meta charset="utf-8">
  <title>StarWars – Login</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">



</head>

<body>

  <div>
    <img class="position-absolute top-0 start-0 w-100 h-100 object-fit-cover" src="./images/vader.jpeg" alt="">
  </div>

  <!-- Conteúdo centralizado -->
  <section class="d-flex min-vh-100 justify-content-center align-items-center">

    <div class="col-4 card text-center ">
      <div class="card-header">
        <ul class="nav nav-tabs card-header-tabs">
          <li class="nav-item">
            <a class="nav-link active" aria-current="true" href="login.html">Login</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="cadastro.html">Cadastro</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="esqueceuSenha.html" aria-disabled="true">Esqueceu senha</a>
          </li>
        </ul>
      </div>
      <div class="card-body">
        <div class="alert alert-danger d-flex align-items-center" role="alert">
          <i class="bi bi-exclamation-circle-fill bi flex-shrink-0 me-2"></i>
          <div>
             wrong user/password
          </div>
        </div>

        <h5 class="card-title  pb-3">Login</h5>

        <div class="input-group mb-3">
          <span class="input-group-text" id="basic-addon1"><i class="bi bi-person"></i></span>
          <input type="text" class="form-control" placeholder="Username" aria-label="Username"
            aria-describedby="basic-addon1">
        </div>

        <div class="input-group mb-3">
          <span class="input-group-text pb-3" id="basic-addon1"><i class="bi bi-unlock"></i></span>
          <input type="password" class="form-control" placeholder="Password" aria-label="Username"
            aria-describedby="basic-addon1">
        </div>

        <a href="home-page.html" class="btn btn-primary">Confirm</a>
      </div>
    </div>

  </section>

  <!-- (Opcional) JS do Bootstrap -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-pVV5Zp4ppvnSNh9sSUlh7G4Q3pIhWKMpGmEiw3kqW0U2R9CXUx5m2v7UzUpB63u" crossorigin="anonymous"></script>

</html>
